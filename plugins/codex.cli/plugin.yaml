schema: transist.plugin.v1
id: codex.cli
version: 0.1.0
adapter: process
entrypoint:
  type: process
  command: plugin.py
prerequisites:
  binaries:
    - name: python3
    - name: codex
package:
  files: [plugin.py, gate_review.py, lean_policy.py, process_lifecycle.py, process_runner.py, schemas/gate-decision.schema.json, schemas/exec_task.input.schema.json, schemas/exec_task.output.schema.json]
actions:
  - name: exec_task
    input_schema: schemas/exec_task.input.schema.json
    output_schema: schemas/exec_task.output.schema.json
    secret_inputs: []
    bindings:
      transist_prompt_v1:
        inline_field: prompt
        file_field: prompt_file
      transist_skills_v1:
        bundle_field: skills_bundle
        rendered_field: skills_rendered
      transist_gate_decision_v1:
        decision_field: gate_decision
capabilities:
  supports_cancel: true
  supports_health: false
  supports_artifact_hints: true
  supports_evidence_hints: false
