schema: transist.plugin.v1
id: text.http
version: 0.1.0
adapter: http
default_provider_kind: local
entrypoint:
  type: http
  base_url: http://127.0.0.1:18765
package:
  files:
    - service.py
    - schemas/analyze.input.schema.json
    - schemas/analyze.output.schema.json
actions:
  - name: analyze
    provider_kind: local
    input_schema: schemas/analyze.input.schema.json
    output_schema: schemas/analyze.output.schema.json
    bindings: {}
capabilities:
  supports_cancel: false
  supports_health: true
  supports_artifact_hints: false
  supports_evidence_hints: false
