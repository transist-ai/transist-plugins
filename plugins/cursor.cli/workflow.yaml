schema: transist.flow.v1
id: cursor_cli_demo
version: 0.1.0
plugins:
  cursor.cli: 0.1.0
inputs:
  prompt:
    type: string
    required: true
steps:
  - id: exec_task
    uses: process:cursor.cli/exec_task
    prompt: "{{inputs.prompt}}"
    with:
      output_mode: compact
      history_mode: invocation
      feedback_context_mode: focused
      max_context_file_bytes: 65536
      max_prompt_bytes: 98304
      secret_refs: ["CURSOR_API_KEY"]
