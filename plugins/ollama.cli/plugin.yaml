schema: transist.plugin.v1
id: ollama.cli
version: 0.1.1
adapter: process
default_provider_kind: local
entrypoint:
  type: process
  command: bin/ollama.cli
prerequisites:
  binaries:
    - name: ollama
package:
  files: [bin/ollama.cli, schemas/generate.input.schema.json, schemas/generate.output.schema.json]
actions:
  - name: generate
    input_schema: schemas/generate.input.schema.json
    output_schema: schemas/generate.output.schema.json
    secret_inputs: []
    bindings:
      transist_prompt_v1:
        inline_field: prompt
        file_field: prompt_file
capabilities:
  supports_cancel: true
  supports_health: false
  supports_artifact_hints: true
  supports_evidence_hints: false
