schema: transist.flow.v1
id: openai_compatible_demo
version: 0.1.0
plugins:
  openai.compatible: 0.1.0
inputs:
  model:
    type: string
    required: true
  prompt:
    type: string
    required: true
  base_url:
    type: string
    default: https://openrouter.ai/api/v1
network:
  mode: none
steps:
  - id: ask
    uses: process:openai.compatible/chat_complete
    network:
      mode: allowlist
      allow_hosts: [openrouter.ai]
      allow_ports: [443]
    with:
      base_url: "{{inputs.base_url}}"
      model: "{{inputs.model}}"
      messages:
        - role: user
          content: "{{inputs.prompt}}"
      secret_refs: [OPENAI_COMPATIBLE_API_KEY]
