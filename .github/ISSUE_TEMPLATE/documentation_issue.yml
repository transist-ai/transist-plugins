name: Documentation issue
description: Report incorrect, missing, or unclear plugin-related documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs.

        For support boundaries, see [Support](https://github.com/transist-ai/transist-plugins/blob/main/SUPPORT.md). For security issues, do not open a public issue; follow [Security](https://github.com/transist-ai/transist-plugins/blob/main/SECURITY.md).

        Redact credentials, customer data, private paths, prompts, and run artifacts from examples and attachments.
  - type: input
    id: page
    attributes:
      label: Affected page or file
      description: Link or path to the doc that needs attention.
      placeholder: plugins/github.cli/README.md or docs/compatibility.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Describe the incorrect, confusing, or missing content.
    validations:
      required: true
  - type: textarea
    id: suggested_fix
    attributes:
      label: Suggested improvement
      description: If you know what would make the page clearer, describe it here.
    validations:
      required: false
