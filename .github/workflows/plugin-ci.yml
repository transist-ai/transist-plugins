name: Plugin checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: plugin-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  PYTHONPATH: ''

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Only gofmt is used; no Go compilation or package execution.
          go-version: '1.22.12'
          cache: false
      - name: Install pinned Python static-check dependencies
        run: python3 -m pip install -r tests/requirements.txt
      - name: Install checksum-verified static-analysis binaries
        env:
          STATIC_TOOLS: ${{ runner.temp }}/static-tools
        run: |
          set -euo pipefail
          mkdir -p "$STATIC_TOOLS"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 60 \
            -o "$STATIC_TOOLS/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$STATIC_TOOLS/actionlint.tar.gz" | sha256sum --check -
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 60 \
            -o "$STATIC_TOOLS/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          printf '%s  %s\n' 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e "$STATIC_TOOLS/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$STATIC_TOOLS/actionlint.tar.gz" -C "$STATIC_TOOLS" actionlint
          tar -xzf "$STATIC_TOOLS/gitleaks.tar.gz" -C "$STATIC_TOOLS" gitleaks
          printf '%s\n' "$STATIC_TOOLS" >> "$GITHUB_PATH"
      - name: Check structure, formatting, lint and secrets
        env:
          BLACK_CACHE_DIR: ${{ runner.temp }}/black-cache
        run: python3 -B scripts/check_static.py
